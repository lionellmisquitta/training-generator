name: Publish sample courses to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'sample-courses/**'
      - '.github/workflows/deploy-sample-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble offline course demos
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, zipfile
          source=Path('sample-courses')
          out=Path('_site')
          out.mkdir(exist_ok=True)
          ai=source/'ai-engineering'/'course.html'
          assert ai.is_file(), 'AI Engineering course.html missing'
          aiout=out/'sample-courses'/'ai-engineering'
          aiout.mkdir(parents=True)
          shutil.copy2(ai,aiout/'course.html')
          gdir=source/'game-theory-explained'
          archives=list(gdir.glob('*.zip'))
          assert len(archives)==1, f'Expected one canonical Game Theory archive, got {len(archives)}'
          with zipfile.ZipFile(archives[0]) as archive:
              candidates=[n for n in archive.namelist() if n.endswith('/course.html') or n=='course.html']
              assert len(candidates)==1, f'Expected one course.html within archive, got {candidates}'
              html=archive.read(candidates[0])
          assert b'<html' in html[:1024].lower(), 'Game Theory player does not appear to be HTML'
          gameout=out/'sample-courses'/'game-theory-explained'
          gameout.mkdir(parents=True)
          (gameout/'course.html').write_bytes(html)
          (out/'index.html').write_text("""<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Training Generator — Sample Courses</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:760px;margin:3rem auto;padding:0 1rem;color:#192c3a}a{color:#0759ab}li{margin:1rem 0}small{color:#53606b}</style></head><body><h1>Training Generator — Sample Courses</h1><p>Explore interactive courses generated with <a href="https://github.com/lionellmisquitta/training-generator">Training Generator</a>.</p><ul><li><a href="sample-courses/ai-engineering/course.html">AI Engineering — launch course</a></li><li><a href="sample-courses/game-theory-explained/course.html">Game Theory Explained — launch course</a></li></ul><p><small>Public demonstration samples. Independent review and formal course release gates remain incomplete; see repository sample READMEs for details.</small></p></body></html>""",encoding='utf-8')
          print('Built:',*(str(p) for p in out.rglob('*.html')))
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
